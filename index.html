
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#090d18">

<title>Hassan Code Studio</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">

<style>
:root{
 --bg:#090d18;
 --panel:#111a2b;
 --panel2:#1a2740;
 --line:#293954;
 --blue:#7187ff;
 --cyan:#35d9d3;
 --text:#edf3ff;
 --muted:#93a3bf;
 --red:#ff7185;
}

*{box-sizing:border-box}

body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,sans-serif;
 min-height:100vh;
 padding-bottom:85px;
}

button,input,textarea{font:inherit}
button{cursor:pointer}

header{
 height:66px;
 background:rgba(17,26,43,.96);
 border-bottom:1px solid var(--line);
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 15px;
 position:sticky;
 top:0;
 z-index:20;
 backdrop-filter:blur(15px);
}

.brand{
 display:flex;
 align-items:center;
 gap:10px;
 font-weight:bold;
}

.logo{
 width:40px;
 height:40px;
 border-radius:13px;
 display:grid;
 place-items:center;
 color:#07111e;
 background:linear-gradient(135deg,var(--blue),var(--cyan));
 font-size:23px;
 font-weight:900;
 box-shadow:0 0 18px #7187ff33;
}

.brand small{
 display:block;
 color:var(--muted);
 font-size:10px;
 margin-top:4px;
}

.btn{
 border:1px solid var(--line);
 background:var(--panel2);
 color:white;
 padding:11px 14px;
 border-radius:12px;
 transition:.2s;
}

.btn:active{
 transform:scale(.94);
}

.primary{
 background:linear-gradient(135deg,var(--blue),#8295ff);
 color:#09101d;
 border-color:var(--blue);
 font-weight:bold;
}

.danger{color:var(--red)}

main{
 max-width:850px;
 margin:auto;
 padding:18px 14px 25px;
}

.page{display:none}

.page.active{
 display:block;
 animation:pageEnter .35s ease both;
}

@keyframes pageEnter{
 from{opacity:0;transform:translateY(14px)}
 to{opacity:1;transform:translateY(0)}
}

.heading{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin:8px 0 20px;
 gap:10px;
}

h2{
 font-size:22px;
 margin:0 0 6px;
}

h3{
 font-size:15px;
 margin:0 0 12px;
}

p{
 color:var(--muted);
 font-size:12px;
 line-height:1.8;
}

.card,.project{
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:18px;
 padding:16px;
 margin-bottom:13px;
}

.project{
 background:linear-gradient(145deg,#18243a,#111a2b);
 animation:projectEnter .4s ease both;
 transition:transform .2s,border-color .2s;
}

.project:active{
 transform:scale(.985);
 border-color:var(--cyan);
}

@keyframes projectEnter{
 from{opacity:0;transform:translateY(15px)}
 to{opacity:1;transform:translateY(0)}
}

.project-top{
 display:flex;
 align-items:center;
 gap:12px;
}

.project-icon{
 width:46px;
 height:46px;
 border-radius:14px;
 display:grid;
 place-items:center;
 background:#293b62;
 font-size:22px;
}

.project-name{
 font-weight:bold;
 font-size:14px;
}

.project-info{
 font-size:11px;
 color:var(--muted);
 margin-top:6px;
 overflow-wrap:anywhere;
}

.project-actions{
 display:flex;
 gap:7px;
 margin-top:15px;
}

.project-actions button{
 flex:1;
 font-size:12px;
 padding:10px 4px;
}

input,textarea{
 width:100%;
 background:#0b1322;
 color:white;
 border:1px solid var(--line);
 border-radius:12px;
 padding:13px;
 outline:none;
}

input:focus,textarea:focus{
 border-color:var(--blue);
 box-shadow:0 0 0 3px #7187ff18;
}

label{
 display:block;
 color:var(--muted);
 font-size:12px;
 margin:14px 0 8px;
}

#code{
 height:55vh;
 min-height:230px;
 resize:vertical;
 direction:ltr;
 text-align:left;
 font:13px/1.8 monospace;
 tab-size:2;
}

.toolbar{
 display:flex;
 gap:8px;
 margin-top:12px;
}

.toolbar button{flex:1}

iframe{
 width:100%;
 height:420px;
 background:white;
 border:0;
 border-radius:12px;
}

.empty{
 text-align:center;
 padding:55px 15px;
 color:var(--muted);
}

.empty-icon{
 font-size:48px;
 margin-bottom:15px;
}

.status{
 font-size:11px;
 color:var(--muted);
 margin-top:12px;
}

#userInfo{
 font-size:10px;
 color:var(--muted);
 margin-top:4px;
}

#authPage{
 max-width:500px;
 margin:auto;
 padding:20px 14px 40px;
}

#authMessage{
 overflow-wrap:anywhere;
}

.owner-label{
 font-size:11px;
 color:var(--cyan);
}

/* Bottom navigation */

.bottom-nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 z-index:30;
 display:flex;
 justify-content:space-around;
 gap:8px;
 padding:10px 15px calc(10px + env(safe-area-inset-bottom));
 background:rgba(17,26,43,.96);
 border-top:1px solid var(--line);
 backdrop-filter:blur(16px);
}

.nav-item{
 flex:1;
 border:1px solid transparent;
 background:transparent;
 color:var(--muted);
 padding:8px 5px;
 border-radius:13px;
 font-size:12px;
 transition:.25s;
}

.nav-item span{
 display:block;
 font-size:21px;
 margin-bottom:4px;
}

.nav-item.selected{
 color:var(--cyan);
 background:#253550;
 border-color:#35d9d333;
 transform:translateY(-3px);
}

/* Intro screen */

#intro{
 position:fixed;
 inset:0;
 z-index:1000;
 background:#090d18;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 transition:opacity .6s,visibility .6s;
}

#intro.hide{
 opacity:0;
 visibility:hidden;
 pointer-events:none;
}

.intro-logo{
 width:105px;
 height:105px;
 border-radius:29px;
 background:linear-gradient(135deg,#7187ff,#35d9d3);
 display:grid;
 place-items:center;
 color:#07111e;
 font-size:58px;
 font-weight:900;
 box-shadow:0 0 55px #7187ff55;
 animation:logoBuild 1.5s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes logoBuild{
 0%{
  opacity:0;
  transform:scale(.1) rotate(-100deg);
  filter:blur(15px);
 }
 60%{
  opacity:1;
  transform:scale(1.15) rotate(8deg);
  filter:blur(0);
 }
 100%{
  transform:scale(1) rotate(0);
 }
}

.intro-title{
 margin-top:24px;
 font-size:21px;
 font-weight:bold;
 opacity:0;
 animation:titleAppear .7s 1s forwards;
}

.intro-subtitle{
 margin-top:9px;
 color:var(--muted);
 font-size:11px;
 opacity:0;
 animation:titleAppear .7s 1.3s forwards;
}

.intro-loader{
 width:110px;
 height:3px;
 background:#1c2940;
 border-radius:10px;
 overflow:hidden;
 margin-top:25px;
}

.intro-loader::after{
 content:"";
 display:block;
 width:40%;
 height:100%;
 background:var(--cyan);
 border-radius:10px;
 animation:loading 1.4s ease-in-out infinite;
}

@keyframes loading{
 from{transform:translateX(250%)}
 to{transform:translateX(-250%)}
}

@keyframes titleAppear{
 to{opacity:1;transform:translateY(0)}
 from{opacity:0;transform:translateY(10px)}
}

@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{
  animation-duration:.01ms!important;
  transition-duration:.01ms!important;
 }
}
</style>
</head>

<body>

<!-- Intro animation -->

<div id="intro">
 <div class="intro-logo">H</div>
 <div class="intro-title">Hassan Code Studio</div>
 <div class="intro-subtitle">Your creative coding space</div>
 <div class="intro-loader"></div>
</div>

<!-- Header -->

<header>
 <div class="brand">
  <div class="logo">H</div>
  <div>
   Hassan Code Studio
   <small id="userInfo">مساحة مشاريعك</small>
  </div>
 </div>

 <button class="btn" id="logoutBtn"
  onclick="logout()" style="display:none">
  خروج
 </button>
</header>

<!-- Authentication -->

<div id="authPage">
 <div class="card" style="margin-top:25px">

  <h2>أهلاً بك 👋</h2>
  <p>سجّل دخولك إلى Hassan Code Studio</p>

  <label>البريد الإلكتروني</label>
  <input id="email" type="email"
   placeholder="example@gmail.com">

  <label>كلمة المرور</label>
  <input id="password" type="password"
   placeholder="كلمة المرور">

  <button class="btn primary"
   style="width:100%;margin-top:18px"
   onclick="login()">
   تسجيل الدخول
  </button>

  <button class="btn"
   style="width:100%;margin-top:10px"
   onclick="register()">
   إنشاء حساب جديد
  </button>

  <p id="authMessage"></p>
 </div>
</div>

<!-- Application -->

<div id="app" style="display:none">

<main>

<!-- Home -->

<section class="page active" id="home">

 <div class="heading">
  <div>
   <h2 id="homeTitle">مشاريعي 👋</h2>
   <p id="homeDescription">مشاريعك المحفوظة.</p>
  </div>

  <button class="btn primary" onclick="newProject()">
   ＋ جديد
  </button>
 </div>

 <div id="projectList"></div>

</section>

<!-- Create -->

<section class="page" id="create">

 <div class="heading">
  <div>
   <h2>مشروع جديد</h2>
   <p>ابدأ مشروعك الجديد.</p>
  </div>
 </div>

 <div class="card">

  <label>اسم المشروع</label>

  <input id="newName" maxlength="50"
   placeholder="مثلاً: موقعي الشخصي">

  <p>اكتب اسم المشروع وبعدها اكتب الكود واحفظه.</p>

  <button class="btn primary"
   style="width:100%;margin-top:10px"
   onclick="createProject()">
   إنشاء وفتح المحرر
  </button>

 </div>
</section>

<!-- Editor -->

<section class="page" id="editor">

 <div class="heading">
  <div>
   <h2 id="editorTitle">محرر HTML</h2>
   <p id="saveMessage">اكتب كود مشروعك</p>
  </div>

  <button class="btn primary" onclick="saveProject()">
   💾 حفظ
  </button>
 </div>

 <div class="card">

  <h3>محرر HTML</h3>

  <textarea id="code"
   spellcheck="false"
   autocapitalize="off"
   autocomplete="off"
   autocorrect="off"
   placeholder="اكتب كود HTML الكامل هنا..."></textarea>

  <div class="toolbar">
   <button class="btn primary" onclick="saveProject()">
    💾 حفظ
   </button>

   <button class="btn" onclick="runProject()">
    ▶ تشغيل
   </button>
  </div>

  <div class="status" id="editorStatus"></div>

 </div>
</section>

<!-- Preview -->

<section class="page" id="run">

 <div class="heading">
  <div>
   <h2>معاينة المشروع</h2>
   <p id="previewName"></p>
  </div>

  <button class="btn" onclick="refreshPreview()">
   ↻ تحديث
  </button>
 </div>

 <div class="card">
  <iframe id="preview" sandbox="allow-scripts"></iframe>
 </div>

</section>

</main>

<!-- Bottom Navigation -->

<nav class="bottom-nav">

 <button class="nav-item selected" id="navHome"
  onclick="goHome();selectNav('navHome')">
  <span>⌂</span>
  الرئيسية
 </button>

 <button class="nav-item" id="navCreate"
  onclick="newProject();selectNav('navCreate')">
  <span>＋</span>
  مشروع جديد
 </button>

</nav>

</div>

<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>

// ==================================
// Firebase Configuration
// ==================================

const firebaseConfig = {
  apiKey: "AIzaSyAEbrW7PXp0tWqT-r6H6HHEw_Vs2fbsdF94",
  authDomain: "hassan-code-studio.firebaseapp.com",
  projectId: "hassan-code-studio",
  storageBucket: "hassan-code-studio.firebasestorage.app",
  messagingSenderId: "1068281263448",
  appId: "1:1068281263448:web:6079c52e0e1ef0787e212d",
  measurementId: "G-5C9MBCVXWN"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const ADMIN_UID = "Q1Tp03lc5BRbbJUxMTDQX484CQO2";

let user = null;
let isAdmin = false;
let projects = [];
let currentProject = null;
let currentId = null;
let unsubscribe = null;

// ==================================
// Intro Animation
// ==================================

window.addEventListener("load",()=>{
 setTimeout(()=>{
  document.getElementById("intro")?.classList.add("hide");
 },2500);
});

// ==================================
// Navigation
// ==================================

function page(id){
 document.querySelectorAll(".page").forEach(p=>{
  p.classList.remove("active");
 });

 document.getElementById(id).classList.add("active");
 window.scrollTo({top:0,behavior:"smooth"});
}

function selectNav(id){
 document.querySelectorAll(".nav-item").forEach(item=>{
  item.classList.remove("selected");
 });

 document.getElementById(id)?.classList.add("selected");
}

function goHome(){
 page("home");
 selectNav("navHome");
}

// ==================================
// Template
// ==================================

const template = `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مشروعي</title>
<style>
body{
background:#101827;
color:white;
font-family:Arial;
text-align:center;
padding:40px 15px;
}
h1{color:#7187ff}
button{
background:#7187ff;
color:white;
border:0;
padding:13px 20px;
border-radius:10px;
}
</style>
</head>
<body>
<h1>أهلاً بك!</h1>
<p>هذا أول مشروع لي.</p>
<button onclick="hello()">اضغط هنا</button>
<script>
function hello(){
alert("أهلاً بك في مشروعي!");
}
<\/script>
</body>
</html>`;

// ==================================
// Authentication
// ==================================

async function login(){

 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const msg=document.getElementById("authMessage");

 if(!email || !password){
  msg.textContent="اكتب البريد وكلمة المرور.";
  return;
 }

 try{
  msg.textContent="جاري تسجيل الدخول...";
  await auth.signInWithEmailAndPassword(email,password);
 }catch(e){
  msg.textContent="تعذر تسجيل الدخول: "+e.message;
 }
}

async function register(){

 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const msg=document.getElementById("authMessage");

 if(!email || !password){
  msg.textContent="اكتب البريد وكلمة المرور.";
  return;
 }

 if(password.length<6){
  msg.textContent="كلمة المرور لازم تكون 6 أحرف على الأقل.";
  return;
 }

 try{
  msg.textContent="جاري إنشاء الحساب...";
  await auth.createUserWithEmailAndPassword(email,password);
 }catch(e){
  msg.textContent="تعذر إنشاء الحساب: "+e.message;
 }
}

// ==================================
// Authentication State
// ==================================

auth.onAuthStateChanged(u=>{

 if(unsubscribe){
  unsubscribe();
  unsubscribe=null;
 }

 user=u;

 if(!u){

  projects=[];
  currentProject=null;
  currentId=null;

  document.getElementById("authPage").style.display="block";
  document.getElementById("app").style.display="none";
  document.getElementById("logoutBtn").style.display="none";

  return;
 }

 isAdmin = u.uid === ADMIN_UID;

 document.getElementById("authPage").style.display="none";
 document.getElementById("app").style.display="block";
 document.getElementById("logoutBtn").style.display="block";

 document.getElementById("userInfo").textContent =
  u.email + (isAdmin ? " · مدير 👑" : "");

 document.getElementById("homeTitle").textContent =
  isAdmin ? "لوحة الإدارة 👑" : "مشاريعي 👋";

 document.getElementById("homeDescription").textContent =
  isAdmin ? "كل مشاريع المستخدمين تظهر هنا." : "مشاريعك المحفوظة.";

 goHome();
 listenProjects();

});

// ==================================
// Firestore Listener
// ==================================

function listenProjects(){

 let query=db.collection("projects");

 if(!isAdmin){
  query=query.where("ownerId","==",user.uid);
 }

 unsubscribe=query.onSnapshot(snapshot=>{

  projects=snapshot.docs.map(doc=>({
   id:doc.id,
   ...doc.data()
  }));

  projects.sort((a,b)=>
   (b.updatedAt||0)-(a.updatedAt||0)
  );

  renderProjects();

 },error=>{
  alert("خطأ بتحميل المشاريع: "+error.message);
 });

}

// ==================================
// Create Project
// ==================================

function newProject(){

 if(!user)return;

 document.getElementById("newName").value="";

 selectNav("navCreate");
 page("create");
}

function createProject(){

 const name=document.getElementById("newName").value.trim();

 if(!name){
  alert("اكتب اسم المشروع أولاً.");
  return;
 }

 currentId=null;

 currentProject={
  name:name,
  html:template,
  ownerId:user.uid,
  ownerEmail:user.email
 };

 document.getElementById("editorTitle").textContent=name;
 document.getElementById("code").value=template;
 document.getElementById("editorStatus").textContent="مشروع جديد غير محفوظ";
 document.getElementById("saveMessage").textContent="اكتب كودك ثم احفظ";

 page("editor");
}

// ==================================
// Render Projects
// ==================================

function renderProjects(){

 const list=document.getElementById("projectList");
 list.innerHTML="";

 if(projects.length===0){

  list.innerHTML=`
   <div class="empty">
    <div class="empty-icon">📂</div>
    <h3>ماكو مشاريع بعد</h3>
    <p>ابدأ بإنشاء أول مشروع.</p>
   </div>`;

  return;
 }

 projects.forEach((p,index)=>{

  const card=document.createElement("div");
  card.className="project";
  card.style.animationDelay=(index*0.06)+"s";

  const top=document.createElement("div");
  top.className="project-top";

  const icon=document.createElement("div");
  icon.className="project-icon";
  icon.textContent="🌐";

  const info=document.createElement("div");
  info.style.flex="1";

  const name=document.createElement("div");
  name.className="project-name";
  name.textContent=p.name||"مشروع بدون اسم";

  const details=document.createElement("div");
  details.className="project-info";

  details.textContent=isAdmin
   ? "صاحب المشروع: "+(p.ownerEmail||"غير معروف")
   : "مشروعك المحفوظ";

  info.append(name,details);
  top.append(icon,info);

  const actions=document.createElement("div");
  actions.className="project-actions";

  const run=document.createElement("button");
  run.className="btn";
  run.textContent="▶ تشغيل";
  run.onclick=()=>openPreview(p.id);

  actions.append(run);

  if(isAdmin){

   const edit=document.createElement("button");
   edit.className="btn primary";
   edit.textContent="✏️ تعديل";
   edit.onclick=()=>openEditor(p.id);

   const del=document.createElement("button");
   del.className="btn danger";
   del.textContent="🗑 حذف";
   del.onclick=()=>deleteProject(p.id);

   actions.append(edit,del);
  }

  card.append(top,actions);
  list.append(card);

 });

}

// ==================================
// Open Editor
// ==================================

function openEditor(id){

 if(!isAdmin){
  alert("التعديل متاح للمدير فقط.");
  return;
 }

 const p=projects.find(x=>x.id===id);
 if(!p)return;

 currentId=id;
 currentProject={...p};

 document.getElementById("editorTitle").textContent=p.name;
 document.getElementById("code").value=p.html||"";
 document.getElementById("editorStatus").textContent="تعديل مشروع محفوظ";
 document.getElementById("saveMessage").textContent="مشروع المستخدم";

 page("editor");
}

// ==================================
// Save Project
// ==================================

async function saveProject(){

 if(!currentProject || !user)return;

 const html=document.getElementById("code").value;

 if(!html.trim()){
  alert("اكتب كود HTML أولاً.");
  return;
 }

 currentProject.html=html;

 try{

  if(!currentId){

   const doc={
    name:currentProject.name,
    html:html,
    ownerId:user.uid,
    ownerEmail:user.email,
    createdAt:Date.now(),
    updatedAt:Date.now()
   };

   const ref=await db.collection("projects").add(doc);

   currentId=ref.id;
   currentProject={...doc,id:ref.id};

   document.getElementById("editorStatus").textContent=
    "✓ تم حفظ المشروع في Firebase";

   alert("تم حفظ مشروعك بنجاح!");

   goHome();
   return;
  }

  if(!isAdmin){
   alert("ما عندك صلاحية تعديل هذا المشروع.");
   return;
  }

  await db.collection("projects").doc(currentId).update({
   html:html,
   updatedAt:Date.now()
  });

  document.getElementById("editorStatus").textContent=
   "✓ تم تحديث المشروع";

  document.getElementById("saveMessage").textContent=
   "✓ تم حفظ تعديلات المدير";

 }catch(e){
  alert("تعذر الحفظ: "+e.message);
 }

}

// ==================================
// Preview
// ==================================

function openPreview(id){

 const p=projects.find(x=>x.id===id);
 if(!p)return;

 currentId=id;
 currentProject={...p};

 document.getElementById("previewName").textContent=p.name;
 document.getElementById("preview").srcdoc=p.html||"";

 page("run");
}

function runProject(){

 if(!currentProject)return;

 const html=doc
 ument.getElementById("code").value;

// ==================================
// Refresh Preview
// ==================================

function refreshPreview(){

 if(currentId){

  const p=projects.find(x=>x.id===currentId);

  if(p){
   document.getElementById("preview").srcdoc=p.html||"";
  }

 }else if(currentProject){

  document.getElementById("preview").srcdoc=
   document.getElementById("code").value;

 }

}

// ==================================
// Delete Project
// ==================================

async function deleteProject(id){

 if(!isAdmin){
  alert("الحذف للمدير فقط.");
  return;
 }

 const p=projects.find(x=>x.id===id);
 if(!p)return;

 if(!confirm("هل تريد حذف المشروع "+p.name+"؟"))return;

 try{
  await db.collection("projects").doc(id).delete();
 }catch(e){
  alert("تعذر الحذف: "+e.message);
 }

}

// ==================================
// Logout
// ==================================

async function logout(){

 if(unsubscribe){
  unsubscribe();
  unsubscribe=null;
 }

 currentProject=null;
 currentId=null;

 await auth.signOut();
}
