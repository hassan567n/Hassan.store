<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#090d18">
<title>Hassan Code Studio</title>
<style>
:root{
 --bg:#090d18;--panel:#111a2b;--panel2:#1a2740;
 --line:#293954;--blue:#7187ff;--cyan:#35d9d3;
 --text:#edf3ff;--muted:#93a3bf;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:Arial,sans-serif;height:100dvh;overflow:hidden
}
button,input,textarea{font:inherit}
button{cursor:pointer}
header{
 height:62px;background:var(--panel);
 border-bottom:1px solid var(--line);
 display:flex;align-items:center;justify-content:space-between;
 padding:0 13px
}
.brand{display:flex;align-items:center;gap:9px;font-weight:bold}
.logo{
 width:38px;height:38px;border-radius:12px;
 display:grid;place-items:center;color:#07111e;
 background:linear-gradient(135deg,var(--blue),var(--cyan));
 font-size:21px;font-weight:bold
}
.brand small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.btn{
 border:1px solid var(--line);background:var(--panel2);
 color:white;padding:11px 13px;border-radius:11px
}
.primary{background:var(--blue);color:#09101d;border-color:var(--blue);font-weight:bold}
.danger{color:#ff8b99}
main{height:calc(100dvh - 62px);overflow:auto}
.page{display:none;padding:16px 13px 90px;min-height:100%}
.page.active{display:block}
.heading{display:flex;align-items:center;justify-content:space-between;margin:8px 0 17px}
h2{font-size:21px;margin:0 0 6px}
h3{font-size:15px;margin:0 0 12px}
p{color:var(--muted);font-size:12px;line-height:1.8}
.card{
 background:var(--panel);border:1px solid var(--line);
 border-radius:17px;padding:15px;margin-bottom:12px
}
.project{
 background:linear-gradient(145deg,#18243a,#111a2b);
 border:1px solid var(--line);border-radius:16px;
 padding:15px;margin-bottom:11px
}
.project-top{display:flex;align-items:center;gap:11px}
.project-icon{
 width:44px;height:44px;border-radius:13px;
 display:grid;place-items:center;background:#293b62;font-size:22px
}
.project-name{font-weight:bold;font-size:14px}
.project-info{font-size:11px;color:var(--muted);margin-top:5px}
.project-actions{display:flex;gap:7px;margin-top:14px}
.project-actions button{flex:1;font-size:12px;padding:10px 4px}
input,textarea{
 width:100%;background:#0b1322;color:white;
 border:1px solid var(--line);border-radius:11px;
 padding:12px;outline:none
}
input:focus,textarea:focus{border-color:var(--blue)}
label{display:block;color:var(--muted);font-size:12px;margin:13px 0 7px}
.editor-tabs{display:flex;gap:6px;margin-bottom:10px}
.editor-tabs button{flex:1}
.editor-tabs button.active{background:var(--blue);color:#07111e}
#code{
 height:48vh;min-height:200px;resize:vertical;
 direction:ltr;text-align:left;font:13px/1.8 monospace;
}
.toolbar{display:flex;gap:7px;margin-top:10px}
.toolbar button{flex:1}
iframe{
 width:100%;height:350px;background:white;
 border:0;border-radius:11px
}
.empty{
 text-align:center;padding:55px 15px;color:var(--muted)
}
.empty-icon{font-size:45px;margin-bottom:15px}
.bottom{
 position:fixed;bottom:0;right:0;left:0;height:65px;
 background:#111a2b;border-top:1px solid var(--line);
 display:grid;grid-template-columns:repeat(3,1fr);
 padding-bottom:env(safe-area-inset-bottom);z-index:5
}
.bottom button{
 border:0;background:none;color:var(--muted);
 display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:4px;font-size:11px
}
.bottom button.active{color:var(--cyan)}
.bottom span{font-size:20px}
.status{font-size:11px;color:var(--muted);margin-top:10px}
#editorTitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(min-width:750px){
 body{max-width:900px;margin:auto}
 .page{padding-left:25px;padding-right:25px}
}
</style>
</head>
<body>

<header>
 <div class="brand">
  <div class="logo">H</div>
  <div>Hassan Code Studio<small>مساحة مشاريعك</small></div>
 </div>
 <button class="btn" onclick="goHome()">مشاريعي</button>
</header>

<main>

<!-- الصفحة الرئيسية -->
<section class="page active" id="home">
 <div class="heading">
  <div>
   <h2>مشاريعي 👋</h2>
   <p>كل مشاريعك المحفوظة بمكان واحد.</p>
  </div>
  <button class="btn primary" onclick="newProject()">＋ جديد</button>
 </div>

 <div id="projectList"></div>

 <div class="card">
  <h3>⚡ Hassan Code Studio</h3>
  <p>اكتب الأكواد، احفظ مشاريعك، وعدّلها وشغّلها متى ما تريد.</p>
 </div>
</section>

<!-- إنشاء مشروع -->
<section class="page" id="create">
 <div class="heading"><h2>مشروع جديد</h2></div>
 <div class="card">
  <h3>📁 معلومات المشروع</h3>
  <label>اسم المشروع</label>
  <input id="newName" maxlength="50" placeholder="مثلاً: موقعي الشخصي">
  <p>راح ينحفظ المشروع باسمك وتكدر ترجعله بأي وقت.</p>
  <button class="btn primary" style="width:100%" onclick="createProject()">
   إنشاء وفتح المحرر
  </button>
 </div>
</section>

<!-- المحرر -->
<section class="page" id="editor">
 <div class="heading">
  <div>
   <h2 id="editorTitle">المحرر</h2>
   <p id="saveMessage">جاهز للكتابة</p>
  </div>
  <button class="btn primary" onclick="saveProject()">💾 حفظ</button>
 </div>

 <div class="card">
  <div class="editor-tabs">
   <button class="btn active" id="tab-html" onclick="switchTab('html')">HTML</button>
   <button class="btn" id="tab-css" onclick="switchTab('css')">CSS</button>
   <button class="btn" id="tab-js" onclick="switchTab('js')">JavaScript</button>
  </div>

  <textarea id="code" spellcheck="false"
   autocapitalize="off" autocomplete="off" autocorrect="off"
   placeholder="اكتب الكود هنا..." oninput="editCode()"></textarea>

  <div class="toolbar">
   <button class="btn primary" onclick="saveProject()">💾 حفظ</button>
   <button class="btn" onclick="runProject()">▶ تشغيل</button>
  </div>
  <div class="status" id="editorStatus">لم يتم إجراء تغييرات</div>
 </div>
</section>

<!-- المعاينة -->
<section class="page" id="run">
 <div class="heading">
  <div><h2>معاينة المشروع</h2><p id="previewName"></p></div>
  <button class="btn" onclick="runProject()">↻ تحديث</button>
 </div>
 <div class="card">
  <iframe id="preview" sandbox="allow-scripts"></iframe>
 </div>
 <button class="btn" style="width:100%" onclick="editCurrent()">✏️ تعديل المشروع</button>
</section>

</main>

<nav class="bottom">
 <button class="active" id="nav-home" onclick="goHome()"><span>📁</span>مشاريعي</button>
 <button id="nav-create" onclick="newProject()"><span>＋</span>مشروع جديد</button>
 <button id="nav-editor" onclick="openLastEditor()"><span>⌨️</span>المحرر</button>
</nav>

<script>
const STORAGE="hassan_code_studio_projects_v2";

const template={
 html:`<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مشروعي</title>
</head>
<body>
<h1>أهلاً بك!</h1>
<p>هذا أول مشروع لي.</p>
<button onclick="hello()">اضغط هنا</button>
</body>
</html>`,
 css:`body{
 background:#101827;
 color:white;
 font-family:Arial;
 text-align:center;
 padding:40px 15px;
}
h1{color:#7187ff}
button{
 background:#7187ff;color:white;
 border:0;padding:13px 20px;
 border-radius:10px;
}`,
 js:`function hello(){
 alert("أهلاً بك في مشروعي!");
}`
};

let projects=loadProjects();
let currentId=null;
let currentTab="html";
let lastEditorId=null;

function loadProjects(){
 try{
  const data=JSON.parse(localStorage.getItem(STORAGE));
  return Array.isArray(data)?data:[];
 }catch(e){return [];}
}

function persist(){
 try{
  localStorage.setItem(STORAGE,JSON.stringify(projects));
  return true;
 }catch(e){
  alert("مساحة التخزين غير كافية أو تعذر الحفظ.");
  return false;
 }
}

function page(id){
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll(".bottom button").forEach(b=>b.classList.remove("active"));
 const nav=document.getElementById("nav-"+id);
 if(nav)nav.classList.add("active");
}

function goHome(){
 renderProjects();
 page("home");
}

function newProject(){
 document.getElementById("newName").value="";
 page("create");
 setTimeout(()=>document.getElementById("newName").focus(),100);
}

function createProject(){
 const name=document.getElementById("newName").value.trim();
 if(!name){alert("اكتب اسم المشروع أولاً");return;}

 const project={
  id:Date.now().toString()+"_"+Math.random().toString(36).slice(2,7),
  name,
  files:{...template},
  created:Date.now(),
  updated:Date.now()
 };

 projects.unshift(project);
 if(!persist()){
  projects.shift();
  return;
 }
 openEditor(project.id);
}

function renderProjects(){
 const list=document.getElementById("projectList");
 list.innerHTML="";

 if(projects.length===0){
  list.innerHTML=`
   <div class="empty">
    <div class="empty-icon">📂</div>
    <h3>ما عندك مشاريع محفوظة بعد</h3>
    <p>ابدأ بإنشاء مشروعك الأول واكتب أكوادك.</p>
    <button class="btn primary" onclick="newProject()">＋ إنشاء أول مشروع</button>
   </div>`;
  return;
 }

 projects.forEach(p=>{
  const card=document.createElement("div");
  card.className="project";

  const top=document.createElement("div");
  top.className="project-top";

  const icon=document.createElement("div");
  icon.className="project-icon";
  icon.textContent="🌐";

  const info=document.createElement("div");
  info.style.flex="1";

  const name=document.createElement("div");
  name.className="project-name";
  name.textContent=p.name;

  const details=document.createElement("div");
  details.className="project-info";
  details.textContent="HTML · CSS · JavaScript";

  info.append(name,details);
  top.append(icon,info);

  const actions=document.createElement("div");
  actions.className="project-actions";

  const run=document.createElement("button");
  run.className="btn";
  run.textContent="▶ تشغيل";
  run.onclick=()=>openPreview(p.id);

  const edit=document.createElement("button");
  edit.className="btn primary";
  edit.textContent="✏️ تعديل";
  edit.onclick=()=>openEditor(p.id);

  const del=document.createElement("button");
  del.className="btn danger";
  del.textContent="🗑";
  del.onclick=()=>deleteProject(p.id);

  actions.append(run,edit,del);
  card.append(top,actions);
  list.appendChild(card);
 });
}

function getCurrent(){
 return projects.find(p=>p.id===currentId);
}

function openEditor(id){
 const p=projects.find(x=>x.id===id);
 if(!p)return;
 currentId=id;
 lastEditorId=id;
 currentTab="html";
 document.getElementById("editorTitle").textContent=p.name;
 loadTab();
 page("editor");
}

function loadTab(){
 const p=getCurrent();
 if(!p)return;
 document.getElementById("code").value=p.files[currentTab]||"";
 ["html","css","js"].forEach(t=>{
  document.getElementById("tab-"+t).classList.toggle("active",t===currentTab);
 });
}

function switchTab(tab){
 saveCurrentText();
 currentTab=tab;
 loadTab();
}

function saveCurrentText(){
 const p=getCurrent();
 if(!p)return;
 p.files[currentTab]=document.getElementById("code").value;
}

function editCode(){
 saveCurrentText();
 const p=getCurrent();
 if(!p)return;
 p.updated=Date.now();
 document.getElementById("editorStatus").textContent="هناك تغييرات غير محفوظة";
 document.getElementById("saveMessage").textContent="تعديلات جديدة";
}

function saveProject(){
 const p=getCurrent();
 if(!p)return;
 saveCurrentText();
 p.updated=Date.now();
 if(persist()){
  document.getElementById("editorStatus").textContent="✓ تم حفظ المشروع";
  document.getElementById("saveMessage").textContent="✓ محفوظ";
 }
}

function buildHTML(p){
 const html=p.files.html||"";
 const css=p.files.css||"";
 const js=p.files.js||"";
 const style="<style>"+css+"</style>";
 const script="<script>"+js.replace(/<\/script/gi,"<\\/script")+"<\/script>";
 let result=html;
 if(/<\/head>/i.test(result))result=result.replace(/<\/head>/i,style+"</head>");
 else result=style+result;
 if(/<\/body>/i.test(result))result=result.replace(/<\/body>/i,script+"</body>");
 else result+=script;
 return result;
}

function openPreview(id){
 const p=projects.find(x=>x.id===id);
 if(!p)return;
 saveCurrentText();
 currentId=id;
 lastEditorId=id;
 document.getElementById("previewName").textContent=p.name;
 document.getElementById("preview").srcdoc=buildHTML(p);
 page("run");
}

function runProject(){
 saveCurrentText();
 saveProject();
 const p=getCurrent();
 if(!p)return;
 document.getElementById("previewName").textContent=p.name;
 document.getElementById("preview").srcdoc=buildHTML(p);
 page("run");
}

function editCurrent(){
 if(currentId)openEditor(currentId);
}

function openLastEditor(){
 if(lastEditorId && projects.some(p=>p.id===lastEditorId)){
  openEditor(lastEditorId);
 }else{
  newProject();
 }
}

function deleteProject(id){
 const p=projects.find(x=>x.id===id);
 if(!p)return;
 if(!confirm("هل تريد حذف المشروع: "+p.name+"؟"))return;
 projects=projects.filter(x=>x.id!==id);
 if(currentId===id)currentId=null;
 if(lastEditorId===id)lastEditorId=null;
 persist();
 renderProjects();
}

renderProjects();
</script>
</body>
    </html>
