<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Quiz Odyssey v8.0 🌋 Elemental Themes & Custom Categories</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --bg-void: #020208;
            --bg-card: rgba(10, 10, 26, 0.94);
            
            --primary-glow: #ff4500;
            --secondary-glow: #00f3ff;
            --accent-glow: #39ff14;
            --ghost-white: #f5f0ff;
            --border-glow: rgba(255, 69, 0, 0.45);
            --font-main: 'Tajawal', sans-serif;
        }

        body[dir="ltr"] {
            --font-main: 'Orbitron', 'Tajawal', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-void);
            color: var(--ghost-white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 12px;
            overflow-x: hidden;
            position: relative;
            transition: background 0.5s ease;
        }

        #effects-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        .cyber-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            background: 
                linear-gradient(rgba(255, 69, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 38px 38px;
        }

        /* Container Card */
        .app-window {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 920px;
            background: var(--bg-card);
            backdrop-filter: blur(25px);
            border: 2px solid var(--border-glow);
            border-radius: 32px;
            padding: 36px 28px;
            box-shadow: 0 0 50px var(--border-glow);
            transition: all 0.4s ease;
        }

        /* Theme Modes styling */
        .theme-lava { --primary-glow: #ff4500; --secondary-glow: #ff8c00; --border-glow: rgba(255, 69, 0, 0.6); }
        .theme-water { --primary-glow: #0077ff; --secondary-glow: #00f3ff; --border-glow: rgba(0, 243, 255, 0.6); }
        .theme-cyber { --primary-glow: #8800ff; --secondary-glow: #ff00ab; --border-glow: rgba(136, 0, 255, 0.6); }
        .theme-matrix { --primary-glow: #39ff14; --secondary-glow: #00ff88; --border-glow: rgba(57, 255, 20, 0.6); }

        .lang-bar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 16px;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid var(--primary-glow);
            color: var(--ghost-white);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .lang-btn:hover, .lang-btn.active {
            background: var(--primary-glow);
            color: #fff;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .header-box { text-align: center; margin-bottom: 24px; }
        .glow-title {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-glow) 0%, var(--secondary-glow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .subtitle { color: var(--secondary-glow); font-size: 0.95rem; font-weight: 600; }

        .section-label {
            font-size: 1rem;
            font-weight: 800;
            color: var(--secondary-glow);
            margin: 18px 0 12px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .mode-tile {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .mode-tile:hover, .mode-tile.active {
            border-color: var(--secondary-glow);
            background: rgba(0, 243, 255, 0.1);
            transform: translateY(-2px);
        }

        .mode-tile .icon { font-size: 1.6rem; margin-bottom: 4px; }
        .mode-tile .name { font-weight: 800; font-size: 0.85rem; }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 4px;
            margin-bottom: 20px;
        }

        .category-grid::-webkit-scrollbar { width: 6px; }
        .category-grid::-webkit-scrollbar-thumb { background: var(--primary-glow); border-radius: 10px; }

        .cat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 10px 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .cat-card:hover, .cat-card.active {
            border-color: var(--primary-glow);
            background: rgba(255, 69, 0, 0.15);
            transform: translateY(-2px);
        }

        .cat-card .icon { font-size: 1.3rem; }
        .cat-card span { font-size: 0.78rem; font-weight: 700; }

        .btn-action {
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.25s ease;
            background: linear-gradient(135deg, var(--primary-glow) 0%, var(--secondary-glow) 100%);
            color: #fff;
            box-shadow: 0 8px 25px var(--border-glow);
        }

        .btn-action:hover { transform: translateY(-3px); }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--secondary-glow);
            margin-top: 10px;
        }

        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hud-badge {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--secondary-glow);
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 18px;
            border: 1px solid var(--secondary-glow);
        }

        .timer-track {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .timer-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--accent-glow), var(--secondary-glow), var(--primary-glow));
            transition: width 1s linear;
        }

        .lifelines-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .lifeline-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid var(--primary-glow);
            color: var(--ghost-white);
            padding: 10px 6px;
            border-radius: 16px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lifeline-btn:hover:not(:disabled) { background: var(--primary-glow); color: #fff; }
        .lifeline-btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: #555; }

        .question-box {
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 22px;
            font-size: 1.3rem;
            font-weight: 800;
            line-height: 1.6;
        }

        .options-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .opt-card {
            background: rgba(255, 255, 255, 0.02);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 16px 20px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .opt-card:hover:not(.disabled) {
            border-color: var(--secondary-glow);
            background: rgba(0, 243, 255, 0.1);
        }

        .opt-card.correct { background: rgba(0, 243, 255, 0.3) !important; border-color: var(--secondary-glow) !important; }
        .opt-card.wrong { background: rgba(255, 69, 0, 0.3) !important; border-color: var(--primary-glow) !important; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 14px;
            margin: 24px 0;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--primary-glow);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }

        .stat-card .val { font-size: 2.2rem; font-weight: 900; color: var(--secondary-glow); }
        .stat-card .lbl { font-size: 0.85rem; color: var(--primary-glow); font-weight: 700; }

        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.35s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="theme-lava">

    <div class="cyber-grid"></div>
    <canvas id="effects-canvas"></canvas>

    <div class="app-window" id="app-card">
        
        <div class="lang-bar">
            <button class="lang-btn active" onclick="setLanguage('ar')">العربية</button>
            <button class="lang-btn" onclick="setLanguage('en')">English</button>
        </div>

        <!-- HOME SCREEN -->
        <div id="screen-home" class="screen active">
            <div class="header-box">
                <h1 class="glow-title" id="txt-title">Super Quiz Odyssey v8.0 🌋</h1>
                <p class="subtitle" id="txt-subtitle">تطوير شامل بأسئلة مخصصة لكل فئة وأطوار ألوان ديناميكية</p>
            </div>

            <div class="section-label" id="lbl-themes">🎨 اختر طور الثيم والبصريات</div>
            <div class="modes-grid">
                <div class="mode-tile active" onclick="setTheme('lava', this)"><div class="icon">🌋</div><div class="name">لافا البركان</div></div>
                <div class="mode-tile" onclick="setTheme('water', this)"><div class="icon">🌊</div><div class="name">عمق المحيط</div></div>
                <div class="mode-tile" onclick="setTheme('cyber', this)"><div class="icon">🔮</div><div class="name">سايبر نيون</div></div>
                <div class="mode-tile" onclick="setTheme('matrix', this)"><div class="icon">💻</div><div class="name">ماتريكس أخضر</div></div>
            </div>

            <div class="section-label" id="lbl-categories">📚 اختر الفئة المطلوبة</div>
            <div class="category-grid" id="category-selector"></div>

            <button class="btn-action" id="btn-start" onclick="startGame()">⚡ انطلاق للتحدي</button>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="screen-quiz" class="screen">
            <div class="hud-bar">
                <div id="hud-cat" class="hud-badge">الفئة</div>
                <div class="hud-badge" id="hud-progress">السؤال 1 / 10</div>
                <div class="hud-badge" id="hud-score">🏆 النقاط: 0</div>
            </div>

            <div class="timer-track"><div id="timer-bar" class="timer-fill"></div></div>

            <div class="lifelines-row">
                <button id="life-5050" class="lifeline-btn" onclick="trigger5050()">🧹 حذف إجابتين</button>
                <button id="life-freeze" class="lifeline-btn" onclick="triggerFreeze()">⏱️ وقت إضافي</button>
                <button id="life-skip" class="lifeline-btn" onclick="triggerSkip()">⏭️ تخطي السؤال</button>
            </div>

            <div class="question-box"><div id="question-text" class="question-text">جاري التحميل...</div></div>
            <div id="options-container" class="options-list"></div>
        </div>

        <!-- END SCREEN -->
        <div id="screen-end" class="screen">
            <div class="header-box">
                <h1 class="glow-title" id="txt-end-title">نتائج التحدي 🔥</h1>
                <p class="subtitle" id="txt-end-sub">تحليل الأداء النهائي</p>
            </div>

            <div class="stats-grid" id="end-stats-grid"></div>

            <button class="btn-action" id="btn-restart" onclick="startGame()">🔄 شوط جديد</button>
            <button class="btn-action btn-secondary" id="btn-home" onclick="navScreen('screen-home')">🏠 القائمة الرئيسية</button>
        </div>

    </div>

    <script>
        const i18n = {
            ar: {
                title: "Super Quiz Odyssey v8.0 🌋",
                subtitle: "تطوير شامل بأسئلة مخصصة لكل فئة وأطوار ألوان ديناميكية",
                themesLbl: "🎨 اختر طور الثيم والبصريات",
                categoriesLbl: "📚 اختر الفئة المطلوبة",
                startBtn: "⚡ انطلاق للتحدي",
                restartBtn: "🔄 شوط جديد",
                homeBtn: "🏠 القائمة الرئيسية",
                endTitle: "نتائج التحدي 🔥",
                endSub: "تحليل الأداء النهائي",
                totalScore: "مجموع النقاط",
                accuracy: "نسبة الدقة"
            },
            en: {
                title: "Super Quiz Odyssey v8.0 🌋",
                subtitle: "Custom Category Questions & Dynamic Theme Modes",
                themesLbl: "🎨 Select Theme & Visual Mode",
                categoriesLbl: "📚 Choose Quiz Category",
                startBtn: "⚡ Launch Challenge",
                restartBtn: "🔄 Play Again",
                homeBtn: "🏠 Main Menu",
                endTitle: "Challenge Results 🔥",
                endSub: "Performance Breakdown",
                totalScore: "Total Score",
                accuracy: "Accuracy Rate"
            }
        };

        /* فئات مخصصة مع بنك أسئلة حقيقي لكل فئة على حدة */
        const categoriesData = [
            { id: "space", icon: "🚀", title: { ar: "الفضاء والكون", en: "Space & Astronomy" }, questions: [
                { q: { ar: "ما هو أكبر كوكب في المجموعة الشمسية؟", en: "What is the largest planet in our solar system?" }, options: ["المشتري", "زحل", "المريخ", "الأسترويد"], ans: "المشتري" },
                { q: { ar: "ما اسم المجرة التي ينتمي إليها كوكب الأرض؟", en: "What is the name of Earth's galaxy?" }, options: ["درب التبانة", "أندروميدا", "سومبريرو", "الماجلان"], ans: "درب التبانة" },
                { q: { ar: "أقرب كوكب إلى الشمس هو؟", en: "Closest planet to the sun?" }, options: ["عطارد", "الزهرة", "المريخ", "الأرض"], ans: "عطارد" },
                { q: { ar: "ما هو الكوكب الأحمر؟", en: "What is the Red Planet?" }, options: ["المريخ", "المشتري", "زحل", "عطارد"], ans: "المريخ" }
            ]},
            { id: "chemistry", icon: "🧪", title: { ar: "الكيمياء والعناصر", en: "Chemistry & Elements" }, questions: [
                { q: { ar: "ما هو الرمز الكيميائي لعنصر الذهب؟", en: "Chemical symbol for Gold?" }, options: ["Au", "Ag", "Fe", "Cu"], ans: "Au" },
                { q: { ar: "ما الغاز الأكثر وفراً في الغلاف الجوي للأرض؟", en: "Most abundant gas in Earth's atmosphere?" }, options: ["النيتروجين", "الأكسجين", "ثاني أكسيد الكربون", "الهيدروجين"], ans: "النيتروجين" },
                { q: { ar: "ما هو الرمز الكيميائي للماء؟", en: "Chemical formula for water?" }, options: ["H2O", "CO2", "NaCl", "O2"], ans: "H2O" },
                { q: { ar: "ما هو العنصر الأكثر خفة في الجدول الدوري؟", en: "Lightest element in periodic table?" }, options: ["الهيدروجين", "الهيليوم", "الليثيوم", "الكربون"], ans: "الهيدروجين" }
            ]},
            { id: "tech", icon: "💻", title: { ar: "البرمجة والتقنية", en: "Tech & Coding" }, questions: [
                { q: { ar: "أي لغة تستخدم لتنسيق صفحات الويب (CSS)؟", en: "What is CSS used for?" }, options: ["تنسيق وتصميم الويب", "هيكلة البيانات", "قواعد البيانات", "الذكاء الاصطناعي"], ans: "تنسيق وتصميم الويب" },
                { q: { ar: "ماذا تعني اختصار لغة HTML؟", en: "What does HTML stand for?" }, options: ["HyperText Markup Language", "High Tech Modern Language", "Hyper Transfer Machine", "Home Tool Markup Language"], ans: "HyperText Markup Language" },
                { q: { ar: "من هو مبتكر لغة جافاسكريبت؟", en: "Creator of JavaScript?" }, options: ["برندان إيك", "ביל غيتس", "ستيف جوبز", "لينوس تورفالدس"], ans: "برندان إيك" }
            ]},
            { id: "math", icon: "🔢", title: { ar: "الرياضيات والمنطق", en: "Math & Logic" }, questions: [
                { q: { ar: "ما هو الجذر التربيعي للعدد 144؟", en: "Square root of 144?" }, options: ["12", "14", "16", "11"], ans: "12" },
                { q: { ar: "ما هو حاصل ضرب 8 × 7 ؟", en: "What is 8 × 7 ?" }, options: ["56", "48", "64", "54"], ans: "56" },
                { q: { ar: "كم يساوي مجموع زوايا المثلث الداخلية؟", en: "Sum of triangle interior angles?" }, options: ["180 درجة", "360 درجة", "90 درجة", "270 درجة"], ans: "180 درجة" }
            ]}
        ];

        let currentLang = 'ar';
        let selectedCategory = 'space';
        let currentTheme = 'lava';
        let questionPool = [];
        let currentIdx = 0;
        let score = 0;
        let timerInterval = null;
        let timerLeft = 15;
        let isAnswering = false;
        let usedLifelines = { '5050': false, 'freeze': false, 'skip': false };

        window.onload = function() {
            setLanguage('ar');
        };

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event?.target?.classList.add('active') || document.querySelectorAll('.lang-btn')[lang === 'ar' ? 0 : 1].classList.add('active');
            document.body.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');

            const t = i18n[lang];
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('txt-subtitle').innerText = t.subtitle;
            document.getElementById('lbl-themes').innerText = t.themesLbl;
            document.getElementById('lbl-categories').innerText = t.categoriesLbl;
            document.getElementById('btn-start').innerText = t.startBtn;
            document.getElementById('btn-restart').innerText = t.restartBtn;
            document.getElementById('btn-home').innerText = t.homeBtn;
            document.getElementById('txt-end-title').innerText = t.endTitle;
            document.getElementById('txt-end-sub').innerText = t.endSub;

            renderCategories();
        }

        function setTheme(themeName, el) {
            currentTheme = themeName;
            document.body.className = `theme-${themeName}`;
            document.querySelectorAll('.modes-grid .mode-tile').forEach(m => m.classList.remove('active'));
            el.classList.add('active');
        }

        function renderCategories() {
            const container = document.getElementById('category-selector');
            container.innerHTML = '';
            categoriesData.forEach(cat => {
                const el = document.createElement('div');
                el.className = `cat-card ${cat.id === selectedCategory ? 'active' : ''}`;
                el.onclick = () => {
                    selectedCategory = cat.id;
                    document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('active'));
                    el.classList.add('active');
                };
                el.innerHTML = `<span class="icon">${cat.icon}</span><span>${cat.title[currentLang]}</span>`;
                container.appendChild(el);
            });
        }

        function navScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startGame() {
            const catObj = categoriesData.find(c => c.id === selectedCategory) || categoriesData[0];
            // خلط الأسئلة الخاصة بالفئة المحددة فقط
            questionPool = [...catObj.questions].sort(() => Math.random() - 0.5);
            currentIdx = 0;
            score = 0;
            isAnswering = false;
            usedLifelines = { '5050': false, 'freeze': false, 'skip': false };

            updateLifelines();
            navScreen('screen-quiz');
            loadQuestion();
        }

        function loadQuestion() {
            isAnswering = false;
            const catObj = categoriesData.find(c => c.id === selectedCategory);
            const qData = questionPool[currentIdx % questionPool.length];

            document.getElementById('hud-cat').innerText = catObj.icon + " " + catObj.title[currentLang];
            document.getElementById('hud-progress').innerText = `السؤال ${currentIdx + 1} / ${questionPool.length}`;
            document.getElementById('hud-score').innerText = `🏆 النقاط: ${score}`;
            document.getElementById('question-text').innerText = qData.q[currentLang];

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            let shuffledOpts = [...qData.options].sort(() => Math.random() - 0.5);
            shuffledOpts.forEach(optText => {
                const btn = document.createElement('div');
                btn.className = 'opt-card';
                btn.innerText = optText;
                btn.onclick = () => selectOption(btn, optText, qData.ans);
                container.appendChild(btn);
            });

            runTimer();
        }

        function runTimer() {
            clearInterval(timerInterval);
            timerLeft = 15;
            const bar = document.getElementById('timer-bar');
            bar.style.width = '100%';

            timerInterval = setInterval(() => {
                timerLeft--;
                bar.style.width = `${(timerLeft / 15) * 100}%`;
                if (timerLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeOut();
                }
            }, 1000);
        }

        function selectOption(selectedEl, selectedVal, correctVal) {
            if (isAnswering) return;
            isAnswering = true;
            clearInterval(timerInterval);

            const cards = document.querySelectorAll('.opt-card');
            cards.forEach(c => c.classList.add('disabled'));

            if (selectedVal === correctVal) {
                selectedEl.classList.add('correct');
                score += 10;
                confetti({ particleCount: 30, spread: 60, origin: { y: 0.7 } });
            } else {
                selectedEl.classList.add('wrong');
                cards.forEach(c => { if (c.innerText === correctVal) c.classList.add('correct'); });
            }

            document.getElementById('hud-score').innerText = `🏆 النقاط: ${score}`;

            setTimeout(() => {
                nextQuestion();
            }, 800);
        }

        function handleTimeOut() {
            if (isAnswering) return;
            isAnswering = true;

            const qData = questionPool[currentIdx % questionPool.length];
            const cards = document.querySelectorAll('.opt-card');
            cards.forEach(c => {
                c.classList.add('disabled');
                if (c.innerText === qData.ans) c.classList.add('correct');
            });

            setTimeout(() => {
                nextQuestion();
            }, 800);
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < questionPool.length) {
                loadQuestion();
            } else {
                endGame();
            }
        }

        function trigger5050() {
            if (usedLifelines['5050'] || isAnswering) return;
            usedLifelines['5050'] = true;
            document.getElementById('life-5050').disabled = true;

            const qData = questionPool[currentIdx % questionPool.length];
            const cards = Array.from(document.querySelectorAll('.opt-card'));
            let removed = 0;
            cards.forEach(c => {
                if (c.innerText !== qData.ans && removed < 1) {
                    c.style.visibility = 'hidden';
                    removed++;
                }
            });
        }

        function triggerFreeze() {
            if (usedLifelines['freeze'] || isAnswering) return;
            usedLifelines['freeze'] = true;
            document.getElementById('life-freeze').disabled = true;
            timerLeft += 10;
        }

        function triggerSkip() {
            if (usedLifelines['skip'] || isAnswering) return;
            usedLifelines['skip'] = true;
            document.getElementById('life-skip').disabled = true;
            nextQuestion();
        }

        function updateLifelines() {
            document.getElementById('life-5050').disabled = usedLifelines['5050'];
            document.getElementById('life-freeze').disabled = usedLifelines['freeze'];
            document.getElementById('life-skip').disabled = usedLifelines['skip'];
        }

        function endGame() {
            navScreen('screen-end');
            const maxScore = questionPool.length * 10;
            const statsGrid = document.getElementById('end-stats-grid');
            const accuracyVal = Math.round((score / maxScore) * 100) || 0;

            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="val">${score} / ${maxScore}</div>
                    <div class="lbl">مجموع النقاط</div>
                </div>
                <div class="stat-card">
                    <div class="val">${accuracyVal}%</div>
                    <div class="lbl">نسبة الدقة</div>
                </div>
            `;

            if (score >= maxScore * 0.7) {
                confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
            }
        }
    </script>
</body>
</html>
